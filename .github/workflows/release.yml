name: Release

# A release happens when the version in apps/server/src/version.ts changes
# on main and CHANGELOG.md has a section for it: this workflow creates the
# tag, publishes the image to GHCR and writes the GitHub release.
# Pushing a v*.*.* tag by hand does the same.
on:
  push:
    branches: [main]
    paths: ["apps/server/src/version.ts", "CHANGELOG.md"]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "version=$version" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          version=$(sed -n 's/.*VERSION = "\(.*\)".*/\1/p' apps/server/src/version.ts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version already released"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "No CHANGELOG section for $version yet"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "Kadrix $version"
          git push origin "v$version"
          echo "release=true" >> "$GITHUB_OUTPUT"

  image:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.prepare.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=Kadrix
            org.opencontainers.image.description=Open-source project management for tech teams, in Arabic and English
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  notes:
    needs: [prepare, image]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: Kadrix ${{ needs.prepare.outputs.version }}
          body_path: notes.md
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
