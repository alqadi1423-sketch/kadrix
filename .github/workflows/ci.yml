name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kadrix
          POSTGRES_PASSWORD: kadrix
          POSTGRES_DB: kadrix_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kadrix"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://kadrix:kadrix@localhost:5432/kadrix_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RTL layout check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install browser
        run: pnpm --filter @kadrix/e2e exec playwright install --with-deps chromium
      - name: Browser tests (Arabic RTL, realtime, co-editing)
        run: |
          PGPASSWORD=kadrix psql -h localhost -U kadrix -d kadrix_test -c "create database kadrix_e2e"
          pnpm e2e
        env:
          E2E_DATABASE_URL: postgres://kadrix:kadrix@localhost:5432/kadrix_e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kadrix .
