name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veloq
          POSTGRES_PASSWORD: veloq
          POSTGRES_DB: veloq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veloq"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://veloq:veloq@localhost:5432/veloq_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: RTL layout check
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t veloq .
