name: CLA

# Asks first-time contributors to agree to CLA.md by commenting on their
# pull request. Signatures are stored on the cla-signatures branch.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: alqadi1423-sketch,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: |
            Thanks for your contribution! Before we can merge it, please read the [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md) and sign it by commenting below with the sentence shown.

            شكرًا لمساهمتك! قبل الدمج نرجو قراءة [اتفاقية ترخيص المساهمين](https://github.com/${{ github.repository }}/blob/main/CLA.md) وتوقيعها بكتابة الجملة الموضحة أدناه في تعليق.
