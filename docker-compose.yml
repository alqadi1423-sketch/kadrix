# Run Kadrix on your own server:
#   cp .env.example .env   (then set AUTH_SECRET and POSTGRES_PASSWORD)
#   docker compose up -d
# Upgrade: docker compose pull && docker compose up -d (migrations run on start).
services:
  kadrix:
    image: ghcr.io/alqadi1423-sketch/veloq:${KADRIX_VERSION:-latest}
    # Builds from this folder when the image cannot be pulled.
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://kadrix:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/kadrix
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (at least 32 characters)}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      KADRIX_EDITION: self-hosted
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Kadrix <no-reply@localhost>}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - kadrix-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kadrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: kadrix
    volumes:
      - kadrix-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadrix"]
      interval: 5s
      retries: 10

volumes:
  kadrix-db:
  kadrix-data:
